apiVersion: apps/v1
kind: Deployment
metadata:
  name: airlock-landing
spec:
  replicas: 1
  selector:
    matchLabels: { app: airlock-landing }
  template:
    metadata:
      labels: { app: airlock-landing }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: assets
              mountPath: /usr/share/nginx/html/assets
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 64Mi, cpu: 100m }
      volumes:
        - name: html
          configMap:
            name: airlock-landing-html
        - name: nginx-conf
          configMap:
            name: airlock-landing-nginx
        - name: assets
          configMap:
            name: airlock-landing-assets
---
apiVersion: v1
kind: Service
metadata:
  name: airlock-landing
spec:
  selector: { app: airlock-landing }
  ports:
    - { port: 80, targetPort: 80 }
