server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same as Frisk's: no access log, so no visitor IPs end up in pod logs.
    access_log off;

    # Belt and braces alongside the per-page <meta name="robots">, while the
    # page is pre-launch. Remove both (and the robots.txt Disallow in
    # k8s/landing.yaml) when Airlock goes on sale.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
