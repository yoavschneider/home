# releaseName is pinned because the scale sets find the controller by its
# service account, which the chart names "<release>-gha-rs-controller".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc
  namespace: arc-systems
spec:
  interval: 1h
  releaseName: arc
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
