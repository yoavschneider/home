# Runners for yoavschneider/oe; its workflows use `runs-on: oe-runners`.
# A pod is created per queued job and removed afterwards (0..2 at a time).
#
# dind gives each job its own Docker daemon so docker/build-push-action works;
# that sidecar runs privileged.
#
# The arc-github Secret is created out of band, from a fine-grained PAT scoped
# to the oe repo only (Administration: read & write):
#   kubectl create secret generic arc-github -n arc-runners --from-literal=github_token=<PAT>
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oe-runners
  namespace: arc-runners
spec:
  interval: 1h
  releaseName: oe-runners
  dependsOn:
    - name: arc
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
  values:
    githubConfigUrl: https://github.com/yoavschneider/oe
    githubConfigSecret: arc-github
    runnerScaleSetName: oe-runners
    minRunners: 0
    maxRunners: 2
    containerMode:
      type: dind
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-gha-rs-controller
