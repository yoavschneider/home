# Self-hosted runners for any repo: workflows use `runs-on: k8s-runner`.
#
# yoavschneider is a personal account, and GitHub only allows account-wide
# runners for organizations, so each repo gets its own scale set below. They
# all share the controller, the label and the arc-github token. To add a repo:
# copy a block, change the name and githubConfigUrl, and add the repo to the
# token's repository access.
#
# Never add a public repo: anyone can open a PR against it, and its workflow
# would run in a privileged pod on this cluster. (Public repos get unlimited
# hosted-runner minutes anyway.)
#
# A pod is created per queued job and removed afterwards. dind gives each job
# its own Docker daemon so docker/build-push-action works; that sidecar runs
# privileged.
#
# The arc-github Secret is created out of band, from a fine-grained PAT scoped
# to exactly these repos (Administration: read & write):
#   read -s PAT && kubectl create secret generic arc-github -n arc-runners \
#     --from-literal=github_token="$PAT" --dry-run=client -o yaml | kubectl apply -f -
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-runner-oe
  namespace: arc-runners
spec:
  interval: 1h
  releaseName: k8s-runner-oe
  dependsOn:
    - name: arc
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
  values:
    githubConfigUrl: https://github.com/yoavschneider/oe
    githubConfigSecret: arc-github
    runnerScaleSetName: k8s-runner
    minRunners: 0
    maxRunners: 2
    containerMode:
      type: dind
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-gha-rs-controller
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-runner-faxoff
  namespace: arc-runners
spec:
  interval: 1h
  releaseName: k8s-runner-faxoff
  dependsOn:
    - name: arc
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
  values:
    githubConfigUrl: https://github.com/yoavschneider/faxoff.app
    githubConfigSecret: arc-github
    runnerScaleSetName: k8s-runner
    minRunners: 0
    maxRunners: 2
    containerMode:
      type: dind
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-gha-rs-controller
