# Tunnel + DNS + ingress rules already provisioned via the Cloudflare API/dashboard
# (config_src: cloudflare) — this deployment just needs the token, no local config.yaml.
#
# Secret was created imperatively so the token never touches git:
#   kubectl create secret generic cloudflared-token -n yoavschneider-dev \
#     --from-literal=token=<TUNNEL_TOKEN>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: yoavschneider-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 200m
