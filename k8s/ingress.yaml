---
# airlock: the page is served from this repo (../airlock), in the
# yoavschneider-dev namespace next to the root landing page -- not in `oe`,
# which is the relay's namespace and is owned by the Airlock repo's own k8s/.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-projects-airlock
  namespace: yoavschneider-dev
spec:
  stripPrefix:
    prefixes:
      - /projects/airlock
---
# Same trailing-slash fix as db/tell/frisk: without it, /projects/airlock
# resolves landing.css and widget.js against /projects/ and 404s them.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-projects-airlock-slash
  namespace: yoavschneider-dev
spec:
  redirectRegex:
    regex: ^https://yoavschneider\.dev/projects/airlock$
    replacement: https://yoavschneider.dev/projects/airlock/
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: yoavschneider-dev-airlock
  namespace: yoavschneider-dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`yoavschneider.dev`) && Path(`/projects/airlock`)
      kind: Rule
      priority: 100
      middlewares:
        - name: redirect-projects-airlock-slash
      services:
        - name: airlock-landing
          port: 80
    - match: Host(`yoavschneider.dev`) && PathPrefix(`/projects/airlock`)
      kind: Rule
      middlewares:
        - name: strip-projects-airlock
      services:
        - name: airlock-landing
          port: 80
