          <text class="sub" x="85" y="192">React · graph viewer</text>

          <rect class="ext" x="10" y="270" width="150" height="56" rx="10"/>
          <text class="title" x="85" y="294">Notion</text>
          <text class="sub" x="85" y="312">boards · pages</text>

          <rect class="ext" x="560" y="30" width="150" height="56" rx="10"/>
          <text class="title" x="635" y="54">Anthropic API</text>
          <text class="sub" x="635" y="72">Sonnet · Haiku</text>

