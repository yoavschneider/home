apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: yoavschneider-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
      volumes:
        - name: html
          configMap:
            name: landing-html
            # Project pages need a directory path so nginx serves them at
            # /projects/<name>/; listing items means every key must be here.
            items:
              - key: index.html
                path: index.html
              - key: impressum.html
                path: impressum.html
              - key: robots.txt
                path: robots.txt
              - key: vhs-dreams.html
                path: projects/vhs-dreams/index.html
              - key: repoguide.html
                path: projects/repoguide/index.html
              - key: flowgeo.html
                path: projects/flowgeo/index.html
              - key: campfire.html
                path: projects/campfire/index.html
