# Root landing page for yoavschneider.dev. Static HTML, served by stock nginx
# with the page mounted from a ConfigMap — no image build/push needed for a
# handful of static files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-html
  namespace: yoavschneider-dev
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yoav Schneider</title>
    <style>
      body {
        margin: 0;
        background: #fff;
        color: #111;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4rem 1.5rem;
      }
      h1 { font-size: 1.75rem; margin: 0 0 0.25rem; }
      .email { color: #666; margin: 0 0 3rem; }
      .email a { color: inherit; }
      .projects {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        justify-content: center;
        max-width: 640px;
      }
      .card {
        display: block;
        width: 260px;
        padding: 1.5rem;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        text-decoration: none;
        color: inherit;
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }
      .card:hover {
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        transform: translateY(-2px);
      }
      .card h2 { margin: 0 0 0.4rem; font-size: 1.1rem; }
      .card p { margin: 0 0 0.6rem; color: #666; font-size: 0.9rem; }
      .card time { color: #aaa; font-size: 0.75rem; }
      footer { margin-top: 3rem; }
      footer a { color: #999; font-size: 0.8rem; text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
    </head>
    <body>
      <h1>Yoav Schneider</h1>
      <p class="email">
        <a href="mailto:yoavschne@gmail.com">yoavschne@gmail.com</a>
        · <a href="https://www.linkedin.com/in/yoav-schneider/">LinkedIn</a>
      </p>

      <div class="projects">
        <a class="card" href="/projects/carpet/">
          <h2>Carpet</h2>
          <p>It's a carpet. Touch it.</p>
          <time>2026</time>
        </a>
        <a class="card" href="/projects/frisk/">
          <h2>Frisk</h2>
          <p>Shows how old an ImmoScout24 listing really is.</p>
          <time>2026</time>
        </a>
        <a class="card" href="/projects/db/">
          <h2>DB +6</h2>
          <p>Firefox plugin that shows estimated delay right on bahn.de.</p>
          <time>2026</time>
        </a>
        <a class="card" href="https://repoguide.dev">
          <h2>RepoGuide</h2>
          <p>Gives coding agents repo experience.</p>
          <time>2026</time>
        </a>
        <a class="card" href="https://ratsfashion.art">
          <h2>RATS Fashion</h2>
          <p>Random ass t-shirts.</p>
          <time>2025</time>
        </a>
      </div>

      <footer><a href="/impressum.html">Impressum</a></footer>
    </body>
    </html>
