---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: yoavschneider-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
      volumes:
        - name: html
          configMap:
            name: landing-html
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: yoavschneider-dev
spec:
  selector:
    app: landing
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: yoavschneider-dev-landing
  namespace: yoavschneider-dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`yoavschneider.dev`) && Path(`/`)
      kind: Rule
      services:
        - name: landing
          port: 80
    - match: Host(`yoavschneider.dev`) && Path(`/impressum.html`)
      kind: Rule
      services:
        - name: landing
          port: 80
