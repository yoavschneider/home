    <body>
    <main>
      <a class="back" href="/">&larr; Yoav Schneider</a>

      <h1>FlowGeo</h1>
      <p class="tagline">Tracks what ChatGPT, Claude and Gemini say about your brand: who they recommend, in what order, and which sources they cite.</p>
      <p class="meta">2025–2026 · Offline · Built with Or Druker · Backend, AI pipeline and infrastructure by me · Go, Python, React, MongoDB, NATS JetStream, Kubernetes</p>

      <div class="summary">
        <ul>
          <li>A two-person product, built with Or Druker. I designed and built the backend: <b>six Go services</b>, the <b>Python LLM service</b>, the event schemas and the Kubernetes/GitOps setup. I also wrote a large part of the React dashboard. Or started the project, built the first version of the React app and many of its pages, and made the marketing site.</li>
          <li>The core is an <b>event-driven AI pipeline</b>. It writes prompts and buyer personas, runs them against three model providers, and pulls brand mentions, rankings, sentiment and cited sources out of every answer. Then it cleans up after itself: it merges duplicate companies and retires prompts that never surface a brand.</li>
        </ul>
      </div>

      <h2>The problem</h2>
      <p>More and more people ask a chatbot instead of a search engine: "What's the best CRM for a small agency?" The answer names a few products and skips the rest. A company has no easy way to see whether it shows up, how high it ranks against its competitors, or which web pages the model relied on.</p>
      <p>This field is called GEO, generative engine optimization. FlowGeo measures it. It asks the models the questions real buyers ask, many times and in many variations, and turns the answers into numbers a marketing team can follow over time.</p>

      <h2>How it works</h2>
      <ol class="flow">
        <li><b>Onboarding.</b> A customer (a "partner" in the code) enters their company name. The LLM service looks the company up on the web and suggests up to 10 of its products. The customer picks one, and FlowGeo creates a visibility metric for it with generated prompts, competitors and locales.</li>
        <li><b>Prompts and personas.</b> Prompts are written the way a buyer would ask them. Each prompt has variants per language and location. A second metric type, <code>persona_visibility</code>, rewrites every prompt in the voice of a generated buyer persona and sends the persona's description along with it. This shows whether the answer changes depending on who is asking.</li>
        <li><b>Scheduled runs.</b> The scheduler checks every 10 minutes which metrics are due (daily, weekly or monthly). For each due metric it creates one task per prompt variant and model, and publishes the tasks as events.</li>
        <li><b>Answers.</b> The LLM service asks each question to ChatGPT, Claude or Gemini, with web search turned on for ChatGPT, and publishes the answer text.</li>
        <li><b>Extraction.</b> The post-processor sends every answer back to the LLM service for structured extraction. It gets back each brand mention, with its exact position in the text, the company and product, a rank and a 1–5 sentiment score, plus the sources the answer cited. Then it matches each name to a known company or product, or creates a new competitor.</li>
        <li><b>Cleanup.</b> After a run, a chain of post-processing steps merges duplicate companies and products, scores how relevant each competitor is, retires prompts that produced no mentions, generates new prompts to replace them, and extracts the attributes the models associated with each brand.</li>
        <li><b>Dashboard.</b> The analytics API turns all of this into share of voice over time, rankings, sentiment, cited sources and prompt-level detail. Users can filter by model, persona and attribute.</li>
      </ol>
      <p>A separate <b>website audit</b> checks whether the customer's own site is easy for AI crawlers to read. When a run finishes, the customer gets an email.</p>

      <h2>Architecture</h2>
      <figure>
        <svg class="diagram" viewBox="0 0 720 450" role="img" aria-label="Architecture: the React client calls client-api over REST. client-api, the scheduler and the post-processor exchange events through NATS JetStream. The LLM service consumes question events and calls ChatGPT, Claude and Gemini, with per-provider rate limits. The post-processor and website-audit call the LLM service over HTTP for extraction. The LLM service publishes usage events to the cost tracker. The analytics API reads MongoDB to serve the dashboard.">
          <defs>
            <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0L10 5L0 10z" fill="#999"/>
            </marker>
          </defs>

          <!-- row 1 -->
          <rect x="10" y="20" width="150" height="56" rx="10"/>
          <text class="title" x="85" y="44">client</text>
          <text class="sub" x="85" y="62">React dashboard</text>

          <rect x="285" y="20" width="150" height="56" rx="10"/>
          <text class="title" x="360" y="44">client-api</text>
          <text class="sub" x="360" y="62">REST · auth</text>

          <rect x="560" y="20" width="150" height="56" rx="10"/>
          <text class="title" x="635" y="44">analytics-api</text>
          <text class="sub" x="635" y="62">share of voice</text>

          <!-- row 2 -->
          <rect x="10" y="140" width="150" height="56" rx="10"/>
          <text class="title" x="85" y="164">scheduler</text>
          <text class="sub" x="85" y="182">runs due metrics</text>

          <rect class="core" x="285" y="140" width="150" height="56" rx="10"/>
          <text class="title core-t" x="360" y="164">JetStream</text>
          <text class="sub core-s" x="360" y="182">NATS · 17 topics</text>

          <rect x="560" y="140" width="150" height="56" rx="10"/>
          <text class="title" x="635" y="164">MongoDB</text>
          <text class="sub" x="635" y="182">all app data</text>

          <!-- row 3 -->
          <rect x="10" y="260" width="150" height="56" rx="10"/>
          <text class="title" x="85" y="284">post-processor</text>
          <text class="sub" x="85" y="302">mentions · rankings</text>

          <rect x="285" y="260" width="150" height="56" rx="10"/>
          <text class="title" x="360" y="284">llm</text>
          <text class="sub" x="360" y="302">Python · FastAPI</text>

          <rect class="ext" x="560" y="260" width="150" height="56" rx="10"/>
          <text class="title" x="635" y="284">Model APIs</text>
          <text class="sub" x="635" y="302">GPT · Claude · Gemini</text>

          <!-- row 4 -->
          <rect x="10" y="380" width="150" height="56" rx="10"/>
          <text class="title" x="85" y="404">website-audit</text>
          <text class="sub" x="85" y="422">15 checks</text>

          <rect x="285" y="380" width="150" height="56" rx="10"/>
          <text class="title" x="360" y="404">cost-tracker</text>
          <text class="sub" x="360" y="422">USD per call</text>

          <!-- edges -->
          <line x1="160" y1="48" x2="283" y2="48" marker-end="url(#a)"/>
          <text class="edge" x="222" y="40">REST · JWT</text>

          <line x1="360" y1="76" x2="360" y2="138" marker-end="url(#a)"/>
          <text class="edge" x="390" y="112">events</text>

          <line x1="635" y1="138" x2="635" y2="78" marker-end="url(#a)"/>
          <text class="edge" x="668" y="112">queries</text>

          <line x1="160" y1="168" x2="283" y2="168" marker-start="url(#a)" marker-end="url(#a)"/>
          <text class="edge" x="222" y="160">tasks</text>

          <line x1="360" y1="196" x2="360" y2="258" marker-start="url(#a)" marker-end="url(#a)"/>
          <text class="edge" x="403" y="232">Q &amp; A</text>

          <line x1="285" y1="196" x2="162" y2="259" marker-start="url(#a)" marker-end="url(#a)"/>
          <text class="edge" x="250" y="242">answers</text>

          <line x1="160" y1="288" x2="283" y2="288" marker-end="url(#a)"/>
          <text class="edge" x="222" y="280">HTTP</text>

          <line x1="435" y1="288" x2="558" y2="288" marker-end="url(#a)"/>
          <text class="edge" x="497" y="280">rate-limited</text>

          <line x1="160" y1="392" x2="298" y2="318" marker-end="url(#a)"/>
          <text class="edge" x="212" y="350">HTTP</text>

          <line x1="360" y1="316" x2="360" y2="378" marker-end="url(#a)"/>
          <text class="edge" x="400" y="352">llm.usage</text>
        </svg>
        <figcaption>The dashed box is external. Every service stores its data in MongoDB. Each one runs in its own Kubernetes deployment.</figcaption>
      </figure>

      <h3>Services</h3>
      <ul>
        <li><b>client-api</b> (Go) has 88 operations, all generated from an OpenAPI spec with <code>oapi-codegen</code>. It handles partners, products, competitors, personas, prompts, metrics, users and onboarding. It also handles login: one-time links by email via Mailjet, or OAuth with Google, Apple, GitHub or Facebook, followed by a JWT in a cookie. Admins and agencies can switch between partners.</li>
        <li><b>analytics-api</b> (Go) serves the dashboard: share of voice, overall and per time bucket, product rankings, mentions, cited sources, prompt quality and insights.</li>
        <li><b>scheduler</b> (Go) decides when metrics run and turns them into tasks. It also watches running executions: a task times out after 10 minutes, an execution after 12 hours and post-processing after 30 minutes. Admins can stop or restart a run by hand.</li>
        <li><b>llm</b> (Python, FastAPI) answers questions from JetStream and exposes about 20 HTTP endpoints for generation and extraction, such as <code>/generate-questions</code>, <code>/adapt-questions-to-personas</code>, <code>/extract-answer-insights</code> and <code>/extract-merge-candidates</code>.</li>
        <li><b>post-processor</b> (Go) turns raw answers into structured data and runs the cleanup chain after each execution.</li>
        <li><b>website-audit</b> (Go) runs 15 checks on a customer's website.</li>
        <li><b>cost-tracker</b> (Go) reads <code>llm.usage</code> events and calculates the cost of each call from a per-model price table. The admin dashboard shows the totals.</li>
      </ul>
      <p>Shared Go code lives in <code>services/go</code>: auth, JetStream, MongoDB, caching, logging and a typed HTTP client for the LLM service (<code>llmconnector</code>). Event and database types live in <code>schemas/</code> and are used by every Go service.</p>

      <h3>The AI layer</h3>
      <ul>
        <li><b>Three providers, one interface.</b> <code>LLMEngine.answer_question</code> routes each task to OpenAI, Anthropic or Google. A mapping file resolves generic names like <code>CHAT_GPT</code> or <code>CLAUDE_SONNET</code> to concrete model versions, so changing a model doesn't need a code change. New onboarding metrics use ChatGPT and Claude by default.</li>
        <li><b>Named profiles for every job.</b> The 19 internal LLM jobs (generate personas, translate prompts, extract insights, classify a company or product, find key pages, and so on) each have a profile with a model and a reasoning effort. Most run on <code>gpt-5-mini</code>. Five use <code>gpt-5.1</code>.</li>
        <li><b>An adaptive rate limiter per provider.</b> Each provider has its own requests-per-minute limit (59 for OpenAI, 29 for Anthropic, 5 for Gemini). When a provider returns a rate-limit error, the limiter pauses for the time the provider asked for and cuts throughput by 20%. After 8 successful calls in a row it adds one request per minute back.</li>
        <li><b>New users go first.</b> Onboarding jobs, like generating personas and prompts or extracting products, are marked high priority. They skip ahead of background extraction, so a new customer isn't stuck waiting behind a big scheduled run.</li>
        <li><b>Prompts that tell the model how to rank.</b> The extraction prompt gives exact rules. Rank comes from list order or from explicit preference. Entities in the same list item share a rank. Ranks must be consecutive from 1, or they're left out. Sentiment defaults to 3 when unclear.</li>
      </ul>

      <h3>Turning answers into clean data</h3>
      <p>Most of the hard work happens after the model has answered. Model output is messy, and the dashboard is only as good as the matching behind it.</p>
      <ul>
        <li><b>Mentions must exist in the text.</b> The extractor returns character offsets for each mention. If the offsets are wrong, <code>findMentionSpanFromContext</code> searches the answer for the surface text, the product name or the company name, with an exact, case-insensitive and then flexible match. Mentions that can't be found are dropped.</li>
        <li><b>Name resolution with a shared cache.</b> Deciding whether "Acme Cloud" is a company, a product or noise takes an LLM call. Results are cached in Redis per partner and name for 24 hours. A short "pending" key stops two workers from classifying the same name at the same time.</li>
        <li><b>Back-pressure.</b> The post-processor processes at most 5 answers per partner and 100 overall at a time. A watchdog frees slots that get stuck, so one large customer can't block everyone else.</li>
        <li><b>Resumable cleanup.</b> The post-processing chain has seven steps: merge companies, merge partner products, score relevance, deactivate low-relevance competitors, check prompt quality, generate new prompts, extract attributes. Each step's state is saved on the execution, so a restart skips the steps that already finished.</li>
        <li><b>Prompts that improve themselves.</b> If a prompt was answered but no answer mentioned any brand, it is switched off with the reason <i>deactivated by system</i>. New prompts are then generated to keep the metric at its target size.</li>
        <li><b>Regression tests from real data.</b> A script exports extraction cases from the database into fixtures. The post-processor's test suite runs against them, so changes to the matching logic can be checked against real answers.</li>
      </ul>

      <h3>Website audit</h3>
      <p>The audit fetches the customer's site the way an AI crawler would, including with a <code>GPTBot</code> user agent. Its 15 checks cover reachability, <code>robots.txt</code> rules for AI bots, <code>llms.txt</code>, Markdown versions of pages, structured data, canonical tags and indexability, JavaScript rendering risk, readability, duplicate pages, broken internal links, caching headers and freshness. Two checks use the LLM: one finds the site's key pages and one checks whether their content is complete.</p>

      <h3>Data and events</h3>
      <p>MongoDB holds everything: partners, products, competitors, personas, metrics with their prompts and variants, executions with their tasks, answers, mentions, sources, rankings, LLM usage and audits. Services talk through 17 JetStream topics, such as <code>metric.execution.question</code>, <code>metric.execution.answer</code>, <code>metric.manifest.post.process</code> and <code>llm.usage</code>. Every event has a typed schema in <code>schemas/events</code>. A run is tracked as a manifest of task IDs. When every task has reported back, the scheduler starts post-processing.</p>

      <h2>Infrastructure</h2>
      <p>The whole system runs on Kubernetes from one Helm chart, with dev, qa and prod environments. Flux applies each environment from Git. Secrets are stored in Git only in encrypted form, as Sealed Secrets. Traffic comes in through a Cloudflare Tunnel to a Traefik ingress with a rate-limit middleware. JetStream runs as a StatefulSet on a persistent volume. Logs are collected by Fluent Bit and shown in Grafana, with Loki storing them.</p>
      <p>Every push to <code>main</code> triggers GitHub Actions to build nine container images, push them to GHCR, and commit the new image tags to the dev values file. Flux then deploys them. A manual workflow promotes the dev images to qa or prod. For local work, one <code>docker compose --profile local</code> command starts the full stack.</p>

      <h2>By the numbers</h2>
      <div class="stats">
        <div class="stat"><b>7</b><span>services (6 Go, 1 Python)</span></div>
        <div class="stat"><b>88</b><span>client-api operations</span></div>
        <div class="stat"><b>17</b><span>event topics</span></div>
        <div class="stat"><b>15</b><span>website audit checks</span></div>
      </div>

      <h2>Stack</h2>
      <ul class="tags">
        <li>Go</li><li>Python</li><li>FastAPI</li><li>TypeScript</li><li>React</li><li>Vite</li><li>TanStack Query</li><li>Astro</li><li>OpenAI</li><li>Anthropic Claude</li><li>Google Gemini</li><li>LangChain</li><li>NATS JetStream</li><li>MongoDB</li><li>Redis</li><li>OpenAPI</li><li>Kubernetes</li><li>Helm</li><li>Flux</li><li>Sealed Secrets</li><li>Traefik</li><li>Cloudflare Tunnel</li><li>Grafana</li><li>Loki</li><li>GitHub Actions</li><li>Docker</li>
      </ul>

      <footer>
        Questions about FlowGeo? <a href="mailto:contact@yoavschneider.dev">contact@yoavschneider.dev</a>
      </footer>
    </main>
    </body>
    </html>
