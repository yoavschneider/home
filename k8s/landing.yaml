    <body>
    <main>
      <a class="back" href="/">&larr; Yoav Schneider</a>

      <h1>VHS Dreams</h1>
      <p class="tagline">A beat-synced music video editor. Upload a song and some footage, and it cuts the video to the music and gives it an analog VHS look.</p>
      <p class="meta">2026 · Offline · Product, architecture and code by me · Go, Python, Next.js, FFmpeg, MongoDB, Redis, Kubernetes</p>
      <p class="note"><b>Note:</b> VHS Dreams is offline. This page describes the code as of its last commit in July 2026.</p>

      <div class="summary">
        <ul>
          <li>I built a full media product on my own in about five weeks: a <b>Go API</b>, a <b>Python media worker</b> and a <b>Next.js editor</b>, with Stripe payments, deployed to Kubernetes with CI/CD.</li>
          <li>The hard part was making cuts land on the beat. Off-the-shelf beat tracking drifted over a long track, so I use it only to find the first downbeat and then build an <b>exact tempo grid</b> from there. Cut points come from <b>bar intensity and kick and frequency peaks</b>, and a scoring function matches each cut to a scene by its visual features.</li>
          <li>Rendering runs as a <b>queue of small jobs</b> with heartbeats and recovery, so a crashed worker doesn't lose work. Exports encode in batches, add audio-driven effects, and run the same <b>ntsc-rs</b> analog filter that the browser previews through <b>WebAssembly</b>.</li>
        </ul>
      </div>

      <h2>The problem</h2>
      <p>Cutting a music video by hand is slow. You find the beats, pick a clip for every bar, trim it to length, and repeat that a few hundred times for one song. Most of that work is mechanical. The song already says where the cuts should go, and the footage already says which shots are calm and which are busy.</p>
      <p>VHS Dreams does that mechanical part. It reads the song's tempo, bars and energy, splits the footage into short scenes, and builds a first cut. The user then edits that cut in a grid, picks an analog look, and exports an MP4.</p>

      <h2>How it works</h2>
      <ol class="flow">
        <li><b>Add a song.</b> The user creates a project and uploads an audio file. The browser sends it straight to object storage with a presigned URL. The worker converts it to a standard WAV and then runs a chain of analysis jobs: tempo, the beat and bar grid, per-bar features and song parts, and kick and frequency-band peaks.</li>
        <li><b>Add footage.</b> The user uploads videos from a computer, or from a phone by scanning a QR code. They can also search Internet Archive, NASA and Wikimedia Commons for public-domain clips from inside the studio. Each video goes through a 14-step pipeline that finds scene cuts, scores each scene, and keeps up to 12 short clips with thumbnails.</li>
        <li><b>Auto-cut.</b> When the audio analysis finishes, the project is cut automatically. Quiet bars become long tiles, intense bars get split on kicks and peaks, and every tile gets a scene whose visual features fit that moment in the song.</li>
        <li><b>Edit.</b> The editor shows the song as a waveform with lanes for bars, beats and peaks, and the cut as a grid of tiles under it. The user can split, merge and drag tiles, swap scenes, set speed or reverse, and preview the whole thing in the browser with the analog filter on.</li>
        <li><b>Export.</b> The user picks a quality (360p, 720p or 1080p), an analog preset and an effects set. The worker renders the MP4 and stores it, and the user downloads it from the project page.</li>
      </ol>

      <h2>Architecture</h2>
      <figure>
        <svg class="diagram" viewBox="0 0 720 340" role="img" aria-label="Architecture: the browser reaches the Next.js web app and the Go API through a Cloudflare Tunnel. The API stores projects, scenes and jobs in MongoDB and pushes jobs onto a Redis queue. The Python worker pops jobs from Redis, downloads clips from public archives, writes clips and exports to Cloudflare R2, and calls the API to run the auto-cut.">
