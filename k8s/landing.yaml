      .diagram rect.ext { fill: #fff; stroke: #d4d4d4; stroke-dasharray: 4 3; }
      .diagram text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111; text-anchor: middle; }
      .diagram .title { font-size: 14px; font-weight: 600; }
      .diagram .sub { font-size: 11px; fill: #666; }
      .diagram .core-t { fill: #fff; }
      .diagram .core-s { fill: #bbb; }
      .diagram .edge { font-size: 10.5px; fill: #888; }
      .diagram line { stroke: #999; stroke-width: 1.25; }
      .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1rem; padding: 0; list-style: none; }
      .tags li { margin: 0; font-size: 0.8rem; border: 1px solid #e5e5e5; border-radius: 999px; padding: 0.15rem 0.65rem; color: #444; }
      footer { margin-top: 4rem; color: #888; font-size: 0.85rem; }
      footer a { color: #666; }
    </style>
    </head>
    <body>
    <main>
      <a class="back" href="/">&larr; Yoav Schneider</a>

      <h1>RepoGuide</h1>
      <p class="tagline">Coding agents start every task from zero. RepoGuide learns from past agent sessions in a repo and gives the next agent a short briefing before it starts searching.</p>
      <p class="meta">2026 · Public beta · Product, architecture and code by me · Go, React, Claude, MCP, MongoDB, Kubernetes · <a href="https://repoguide.dev">repoguide.dev</a> · <a href="https://github.com/repoguide-dev">GitHub</a></p>

      <div class="result">
        <div><b>32%</b><span>fewer input tokens</span></div>
        <div><b>94%</b><span>success rate, same as without RepoGuide</span></div>
        <div><b>108</b><span>benchmark runs</span></div>
      </div>
      <p class="result-note">Measured on a reproducible benchmark: 18 tasks, 3 runs each, with and without RepoGuide. Details below.</p>

      <div class="summary">
        <ul>
          <li>I built a developer tool on my own: a <b>Go CLI with a built-in MCP server</b>, a Go backend, a React web app, a shared Go module and a benchmark harness. The CLI ships through Homebrew, signed and notarized for macOS.</li>
          <li>The core is a <b>mostly deterministic retrieval pipeline</b>. It parses session logs from seven coding agents, mines which files get read and edited together, and builds an evidence-backed briefing for the current task. Claude only routes the task and picks from candidate IDs. It never writes the advice.</li>
          <li>I measured it with a <b>reproducible benchmark</b> (108 agent runs): <b>32% fewer input tokens</b> on average with the same 94% success rate, but only 4% lower cost.</li>
        </ul>
      </div>

      <h2>The problem</h2>
      <p>A coding agent like Claude Code or Codex knows nothing about your repo when a task starts. It greps, opens files, guesses, opens more files, and only then makes its first edit. The next session does the same search again, even when yesterday's session already found the right files, hit the same dead end and learned which test catches the bug.</p>
      <p>The usual fixes don't solve this. Code search tells the agent where code is, not which files mattered for this kind of change. RAG finds text that looks similar. A <code>CLAUDE.md</code> file is what someone wrote once, and it goes stale.</p>
      <p>RepoGuide uses a different source: the agent sessions themselves. They record what was searched, read, edited and tested, and what failed. That is evidence of what actually worked in this repo.</p>

      <h2>How it works</h2>
      <ol class="flow">
        <li><b>Setup.</b> <code>repoguide setup</code> finds the Git repos on the machine, initializes one, and registers the RepoGuide MCP server in every coding agent it detects: Claude Code, Codex, Cursor, OpenCode, GitHub Copilot and Gemini CLI. Cloud mode signs in to the hosted backend. <code>--offline</code> runs everything locally.</li>
        <li><b>Ingest.</b> The CLI reads the agents' own session logs from disk and turns them into one common event stream: prompts, file reads, edits, searches, shell commands, test runs and token usage. Secrets are redacted. Prompts can be redacted too before anything leaves the machine.</li>
        <li><b>Analyze.</b> The analysis step finds files that are read and edited together, which tests belong to which code, and which searches led nowhere. It groups the files into subsystems, and Claude Sonnet turns those groups into named <b>topics</b> (for example "checkout" or "order refunds"), each with start files, workflows, risks and tests.</li>
        <li><b>Brief.</b> When a new task starts, the agent calls <code>repoguide_get_repo_experience</code> with the task. RepoGuide matches it to a topic, finds the past sessions that did similar work, and returns a compact package: where to start, what to avoid, which files usually change together, and how to validate the change.</li>
        <li><b>Feedback.</b> At the end of the session, a hook nudges the agent to call <code>repoguide_record_feedback</code>: which advice helped, which was wrong, what was missing. Feedback moves each advice item's confidence up or down and can patch topics, so the experience improves with use instead of going stale.</li>
      </ol>

      <h2>Architecture</h2>
      <figure>
        <svg class="diagram" viewBox="0 0 720 340" role="img" aria-label="Architecture: the repoguide CLI reads agent session logs and git history, and serves coding agents over MCP on stdio. In cloud mode it uploads session events over HTTPS to the Go backend, which stores topics and sessions in MongoDB and calls Claude through the Anthropic API. A React web app talks to the same backend. In offline mode the CLI stores everything in SQLite.">
          <defs>
            <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0L10 5L0 10z" fill="#999"/>
            </marker>
          </defs>

          <!-- external inputs -->
          <rect class="ext" x="10" y="30" width="150" height="56" rx="10"/>
          <text class="title" x="85" y="54">Session logs</text>
          <text class="sub" x="85" y="72">7 agent formats</text>

          <rect class="ext" x="10" y="150" width="150" height="56" rx="10"/>
          <text class="title" x="85" y="174">Coding agent</text>
          <text class="sub" x="85" y="192">Claude Code, Codex, &hellip;</text>

          <rect class="ext" x="10" y="270" width="150" height="56" rx="10"/>
          <text class="title" x="85" y="294">Git repo</text>
          <text class="sub" x="85" y="312">files · renames</text>

          <!-- middle column -->
          <rect x="285" y="30" width="150" height="56" rx="10"/>
          <text class="title" x="360" y="54">Web app</text>
          <text class="sub" x="360" y="72">React · topic editor</text>

          <rect class="core" x="285" y="150" width="150" height="56" rx="10"/>
          <text class="title core-t" x="360" y="174">repoguide CLI</text>
          <text class="sub core-s" x="360" y="192">Go · MCP server</text>

          <rect x="285" y="270" width="150" height="56" rx="10"/>
