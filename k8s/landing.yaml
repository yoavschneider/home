          <text class="edge" x="222" y="290">OAuth · API</text>

          <line x1="360" y1="86" x2="360" y2="148" marker-start="url(#a)" marker-end="url(#a)"/>

          <line x1="435" y1="164" x2="560" y2="72" marker-end="url(#a)"/>
          <text class="edge" x="515" y="112">LLM calls</text>

          <line x1="435" y1="178" x2="558" y2="178" marker-end="url(#a)"/>
          <text class="edge" x="497" y="192">tool calls</text>

          <line x1="635" y1="206" x2="635" y2="268" marker-end="url(#a)"/>

          <line x1="435" y1="298" x2="558" y2="298" marker-start="url(#a)" marker-end="url(#a)"/>
          <text class="edge" x="497" y="290">job queue</text>
