          <text class="sub" x="635" y="312">knowledge graph</text>

          <!-- edges -->
          <line x1="160" y1="58" x2="283" y2="58" marker-start="url(#a)" marker-end="url(#a)"/>
          <text class="edge" x="222" y="50">Socket Mode WS</text>

          <line x1="160" y1="178" x2="283" y2="178" marker-end="url(#a)"/>
