    <body>
    <main>
      <a class="back" href="/">&larr; Yoav Schneider</a>

      <h1>Campfire</h1>
      <p class="tagline">An AI onboarding assistant that lives in Slack. Every new hire's questions make the docs a little better for the next one.</p>
      <p class="meta">2026 · Product, architecture and code by me · UX and design by Shani Brazilai · Go, React, Claude, MongoDB, Kubernetes</p>
      <p class="note"><b>Note:</b> I stopped working on Campfire after 10 discovery interviews with potential customers, found through LinkedIn. The market turned out to be too niche, and Anthropic released Claude for Slack around the same time.</p>

      <div class="summary">
        <ul>
          <li>I built an AI product from scratch: <b>five Go services</b>, a React admin app, a marketing site and a fake Slack for testing, deployed to Kubernetes with CI/CD.</li>
          <li>I designed a <b>tool-using Claude agent</b> that runs structured interviews in Slack, turns what people say into a <b>knowledge graph</b>, and writes and maintains Notion pages.</li>
        </ul>
      </div>

      <h2>The problem</h2>
      <p>Most of what a new hire needs isn't written down. It's in people's heads and in old Slack threads. Every time someone joins, the team explains the same things again, and the answers disappear once the new hire has them. Onboarding tools track checklists. They don't capture that knowledge.</p>
      <p>Campfire tries to capture it. Each onboarding should leave the documentation a bit better than it was before.</p>

      <h2>How it works</h2>
      <ol class="flow">
        <li><b>Manager setup.</b> The manager chats with the bot in a Slack DM, whenever they have time. They cover who is joining, who's on the team, which topics matter and who owns each one, and what the first real tasks are. The manager can also dump existing documentation into the chat as files. Campfire reads them, pulls out topics, people, tools and processes, asks the manager to confirm them, and skips any questions the docs already answer. At the end, Campfire sets up a Notion workspace for the new hire.</li>
        <li><b>Team interviews.</b> Campfire interviews each topic owner for about 10 minutes, in Slack, whenever it suits them. It asks about tools, docs, people, common mistakes and recent changes. It follows up on vague answers and reads back what it understood so the owner can confirm it.</li>
        <li><b>Knowledge graph and board.</b> A background pipeline pulls people, tools, systems, processes, decisions and knowledge gaps out of each transcript. It then builds a personal Notion board for the new hire, with a welcome page and tasks to learn, do, watch and meet people about.</li>
        <li><b>New-hire Q&amp;A.</b> The new hire asks questions in Slack. Campfire looks for the answer in the graph, then in linked docs, then in source systems. If none of those have it, Campfire routes the question to the right expert. It records the expert's answer, asks them to approve it, and saves it as a page, so the next hire won't need to ask.</li>
      </ol>
      <p>Over time, managers also get an overview of their team's knowledge: gaps in the documentation, questions that keep coming up, and single points of failure, meaning topics only one person knows.</p>

      <h2>Architecture</h2>
      <figure>
        <svg class="diagram" viewBox="0 0 720 340" role="img" aria-label="Architecture: Slack connects over Socket Mode to the Slack connector, which feeds the API server running the Claude agent. The agent calls Anthropic models and a scoped MCP tool server that reads and writes the MongoDB knowledge graph. A Notion worker syncs the graph with Notion through a job queue. An admin UI talks to the API through a Cloudflare Tunnel.">
          <defs>
            <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0L10 5L0 10z" fill="#999"/>
            </marker>
          </defs>

          <!-- external systems -->
          <rect class="ext" x="10" y="30" width="150" height="56" rx="10"/>
          <text class="title" x="85" y="54">Slack</text>
          <text class="sub" x="85" y="72">interviews · Q&amp;A</text>

          <rect class="ext" x="10" y="150" width="150" height="56" rx="10"/>
