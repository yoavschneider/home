# Copy to secrets.yaml (gitignored), fill in real values, then: kubectl apply -f k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mongo-root-credentials
  namespace: db
stringData:
  username: ""
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-service-credentials
  namespace: db
stringData:
  db-risk-factor-username: ""
  db-risk-factor-password: ""
  db-risk-factor-backup-uri: "" # mongodb://<user>:<pass>@mongo-0.mongo-headless.db.svc.cluster.local:27017,mongo-1.mongo-headless.db.svc.cluster.local:27017,mongo-2.mongo-headless.db.svc.cluster.local:27017/db_risk_factor?replicaSet=rs0&authSource=db_risk_factor
  repoguide-username: ""
  repoguide-password: ""
  repoguide-backup-uri: "" # same host list, database repoguide
---
# generate with: openssl rand -base64 756
apiVersion: v1
kind: Secret
metadata:
  name: mongo-keyfile
  namespace: db
stringData:
  keyfile: ""
---
# R2 (S3-compatible) bucket for mongodump backups
apiVersion: v1
kind: Secret
metadata:
  name: r2-credentials
  namespace: db
stringData:
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  R2_ENDPOINT: "" # https://<account_id>.r2.cloudflarestorage.com
  R2_BUCKET: ""
